$schema: "https://json-schema.org/draft/2020-12/schema"
id: https://oirlab.github.io/schemas/target.schema
$defs:
  object_fiber_enum:
    type: string
    enum: [
      "SCIENCE",
      "WHITELIGHT",
      "LFC-R", "LFC-B",
      "ETALON-R", "ETALON-B",
      "UNe", "GASCELL",
      "SKY", "SPECKLE",
      "BLOCKED", "NONE"
    ]
    default: "NONE"
    source: ICS

type: object
properties:
  target_name:
    title: "Target or object name, internal or on-sky"
    fits_keyword: OBJECT
    cal_db: true
    include_ancestors: true
    source: ICS

  target_ra:
    title: "Target Right Ascension"
    fits_keyword: RA
    type: number
    unit: degrees
    merge_rule: mean
    source: ICS

  target_dec:
    title: "Target Declination"
    fits_keyword: DEC
    type: number
    unit: degrees
    merge_rule: mean
    source: ICS

  target_rapm:
    title: "Target proper motion in RA"
    fits_keyword: RAPM
    type: number
    unit: degrees
    merge_rule: mean
    source: ICS

  target_decpm:
    title: "Target proper motion in Dec"
    fits_keyword: DECPM
    type: number
    unit: degrees
    merge_rule: mean
    source: ICS

  airmass_start:
    title: "Airmass at start of exposure"
    fits_keyword: AIRMAST
    type: number
    source: ICS

  airmass_end:
    title: "Airmass at end of exposure"
    fits_keyword: AIRMAEND
    type: number
    source: ICS

  azimuth_start:
    title: "Azimuth at start of exposure"
    fits_keyword: AZST
    type: number
    source: ICS

  azimuth_end:
    title: "Azimuth at end of exposure"
    fits_keyword: AZEND
    type: number
    source: ICS

  elevation_start:
    title: "Elevation at start of exposure"
    fits_keyword: ELSTART
    type: number
    source: ICS

  elevation_end:
    title: "Elevation at end of exposure"
    fits_keyword: ELEND
    type: number
    source: ICS

  equinox:
    title: "Equinox of coordinates"
    fits_keyword: EQUINOX
    default: "2000"
    source: ICS

  object_fiber1:
    allOf:
    - $ref: '#/$defs/object_fiber_enum'
    - title: "Object name in fiber 1"
      fits_keyword: OBJFIB1
      cal_db: true
      include_ancestors: true
      merge_rule: fiber_state
      source: ICS

  object_fiber2:
    allOf:
    - $ref: '#/$defs/object_fiber_enum'
    - title: "Object name in fiber 2"
      fits_keyword: OBJFIB2
      cal_db: true
      include_ancestors: true
      merge_rule: fiber_state
      source: ICS

  object_fiber3:
    allOf:
    - $ref: '#/$defs/object_fiber_enum'
    - title: "Object name in fiber 3"
      fits_keyword: OBJFIB3
      cal_db: true
      include_ancestors: true
      source: ICS

  distance_fiber1:
      title: "Distance of fiber 1 from tracking axis"
      fits_keyword: DISTFIB1
      include_ancestors: true
      type: number
      unit: arcseconds
      source: ICS

  distance_fiber2:
      title: "Distance of fiber 2 from tracking axis"
      fits_keyword: DISTFIB2
      include_ancestors: true
      type: number
      unit: arcseconds
      source: ICS

  distance_fiber3:
      title: "Distance of fiber 3 from tracking axis"
      fits_keyword: DISTFIB3
      include_ancestors: true
      type: number
      unit: arcseconds
      source: ICS

  # Target OB contents
  # NOTE: Final home TBD
  target_gaia_epoch:
    title: "Epoch of Gaia coordinates"
    fits_keyword: GAIAEPCH
    type: number
    unit: year
    default: 2016.5
    merge_rule: first
    source: ICS
  
  target_gaia_id:
    title: "Gaia DR3 source ID"
    fits_keyword: GAIAID
    type: string
    merge_rule: first
    source: ICS

  target_gaia_px:
    title: "Gaia DR3 parallax"
    fits_keyword: GAIAPX
    type: number
    unit: mas
    merge_rule: first
    source: ICS

  target_gaia_ra:
    title: "Gaia DR3 RA"
    fits_keyword: GAIARA
    type: number
    unit: degrees
    merge_rule: first
    source: ICS

  target_gaia_dec:
    title: "Gaia DR3 Dec"
    fits_keyword: GAIADEC
    type: number
    unit: degrees
    merge_rule: first
    source: ICS

  target_gaia_ra_unc:
    title: "Gaia DR3 RA uncertainty"
    fits_keyword: GAIAURA
    type: number
    unit: mas
    merge_rule: first
    source: ICS

  target_gaia_dec_unc:
    title: "Gaia DR3 Dec uncertainty"
    fits_keyword: GAIAUDEC
    type: number
    unit: mas
    merge_rule: first
    source: ICS

  target_gaia_decpm:
    title: "Gaia DR3 proper motion in Dec"
    fits_keyword: GAIADCPM
    type: number
    unit: degrees
    merge_rule: first
    source: ICS

  target_gaia_rapm:
    title: "Gaia DR3 proper motion in RA"
    fits_keyword: GAIARAPM
    type: number
    unit: degrees
    merge_rule: first
    source: ICS

  target_gaia_teff:
    title: "Gaia DR3 effective temperature"
    fits_keyword: GAIATEFF
    type: number
    unit: K
    merge_rule: first
    source: ICS

  target_gaia_rvsys:
    title: "Gaia DR3 radial velocity"
    fits_keyword: GAIARVSY
    type: number
    unit: km/s
    merge_rule: first
    source: ICS

  target_gaia_vbroad:
    title: "Gaia DR3 broadening (vsini)"
    fits_keyword: GAIAVBRO
    type: number
    unit: km/s
    merge_rule: first
    source: ICS

  target_2mass_id:
    title: "2MASS ID"
    fits_keyword: TMASSID
    type: string
    merge_rule: first
    source: ICS

  target_2mass_mag_j:
    title: "2MASS J-band magnitude"
    fits_keyword: TMAGJ
    type: number
    merge_rule: first
    source: ICS

  target_2mass_mag_h:
    title: "2MASS H-band magnitude"
    fits_keyword: TMAGH
    type: number
    merge_rule: first
    source: ICS

  target_2mass_mag_ks:
    title: "2MASS Ks-band magnitude"
    fits_keyword: TMAGKS
    type: number
    merge_rule: first
    source: ICS

  force_berv_m_s:
    title: "Forced barycentric Earth radial velocity (simulations)"
    fits_keyword: FBERV
    type: number
    unit: m/s
    merge_rule: first
    source: DRP