type: object
properties:
  exposure_type:
    title: "Type of exposure"
    fits_keyword: IMTYPE
    enum: ["DARK", "BIAS", "DETFLAT", "SPEC", "NONE"]
    default: NONE

  mjd_start:
    title: "Exposure start Modified Julian Date of first read"
    fits_keyword: EXPMJDST
    type: number
    include_calibration_db: true

  read_mode:
    title: "Readout mode"
    fits_keyword: READMODE
    default: DEFAULT
    include_calibration_db: true

  exposure_time:
    title: "Effective exposure time"
    fits_keyword: EXPTIME
    type: number
    unit: sec
    default: 0

  clock_rate:
    title: "Clock rate of the readout of the detector."
    fits_keyword: CLOCKRAT
    type: number
    unit: Hz