$schema: "https://json-schema.org/draft/2020-12/schema"
id: https://oirlab.github.io/schemas/exposure.schema
type: object
properties:
  exposure_type:
    title: "Type of exposure"
    fits_keyword: IMTYPE
    enum: ["DARK", "BIAS", "DETFLAT", "SPEC", "NONE"]

  mjd_start:
    title: "Exposure start Modified Julian Date of first read"
    fits_keyword: MJDST
    type: number
    cal_db: true
    merge_rule: first

  mjd_mid:
    title: "Exposure mid-point Modified Julian Date"
    fits_keyword: MJDMID
    type: number
    merge_rule: mean
  
  mbjd_mid:
    title: "Exposure mid-point Modified Julian Date"
    fits_keyword: MBJDMID
    type: number
    merge_rule: mean

  # Update this with enum once we have a defined set of read modes
  read_mode:
    title: "Readout mode"
    fits_keyword: READMODE
    cal_db: true
    default: 'DEFAULT'

  exposure_time:
    title: "Effective exposure time"
    fits_keyword: EXPTIME
    type: number
    unit: sec
    default: 0
    merge_rule: sum
    include_ancestors: true

  clock_rate:
    title: "Clock rate of the readout of the detector"
    fits_keyword: CLOCKRAT
    type: number
    unit: Hz