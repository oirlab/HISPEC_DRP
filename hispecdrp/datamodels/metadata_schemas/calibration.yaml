$schema: "https://json-schema.org/draft/2020-12/schema"
id: https://oirlab.github.io/schemas/calibration.schema
type: object
properties:
  cal_id:
    title: "Unique calibration identifier"
    fits_keyword: CALID
    cal_db: id

  cal_type:
    title: "Type of calibration"
    fits_keyword: CALTYPE
    cal_db: true

  master_cal:
    title: "Appropriate for calibrating data?"
    fits_keyword: MASTCAL
    type: boolean
    cal_db: true

  cal_version:
    title: "Calibration version"
    fits_keyword: CALVER
    cal_db: true

  origin: # NOTE: This may get moved to core.yaml.
    title: "Origin of the calibration file"
    fits_keyword: ORIGIN
    enum: [KECK, LOCAL]
    cal_db: true