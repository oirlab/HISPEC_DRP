$schema: "https://json-schema.org/draft/2020-12/schema"
id: https://oirlab.github.io/schemas/data_quality.schema
type: object
properties:
  
  data_quality:
    title: "Data quality flag at the exposure level"
    fits_keyword: DATAQUAL
    default: GOOD
    enum: [GOOD, BAD]
    cal_db: true
    source: DRP

  median_dark_current:
    title: "Median dark current"
    unit: 'DN/s'
    fits_keyword: MEDDARK
    type: number
    merge_rule: mean
    include_ancestors: true
    source: DRP

  median_bias_level:
    title: "Median bias level"
    unit: 'DN'
    fits_keyword: MEDBIAS
    type: number
    merge_rule: mean
    include_ancestors: true
    source: DRP

  median_kTC_level:
    title: "Median kTC noise level"
    unit: 'DN'
    fits_keyword: MEDKTC
    type: number
    merge_rule: mean
    include_ancestors: true
    source: DRP

  median_flat_whitelamp_intensity:
    title: "Median flat white lamp intensity"
    unit: 'DN/s'
    fits_keyword: MEDFLAT
    type: number
    merge_rule: mean
    include_ancestors: true
    source: DRP
  