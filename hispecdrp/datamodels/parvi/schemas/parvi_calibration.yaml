%YAML 1.2
---
cal_type:
  comment: "Type of calibration"
  keyword: CALTYPE
  datatype: string
master_cal:
  comment: "Appropriate for calibrating data?"
  keyword: CALMAST
  datatype: bool
  default: false
cal_id:
  comment: "Unique identifier for the calibration"
  keyword: CALID
  datatype: string