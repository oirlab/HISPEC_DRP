%YAML 1.2
---
type: object
properties:
  exposure:
    comment: "Exposure information"
    type: object
    properties:
      exposure_type:
        fits_keyword: IMTYPE
        comment: "Type of exposure"
        type: string
      jd_start:
        fits_keyword: EXPJDST
        comment: "Exposure start time"
        unit: JD
        type: number
      jd_mid:
        fits_keyword: EXPJDMID
        comment: "Exposure mid time"
        unit: JD
        type: number
      jd_end:
        fits_keyword: EXPJDEND
        comment: "Exposure end time"
        unit: JD
        type: number
      date_start:
        fits_keyword: EXPDTST
        comment: "Exposure start date in YYYYMMDD"
        type: string
      date_mid:
        fits_keyword: EXPDTMID
        comment: "Exposure mid date in YYYYMMDD"
        type: string
      date_end:
        fits_keyword: EXPDTEND
        comment: "Exposure end date in YYYYMMDD"
        type: string
      time_start:
        fits_keyword: EXPTMST
        comment: "Exposure start time in hh:mm:ss.ss"
        type: string
      time_mid:
        fits_keyword: EXPTMMID
        comment: "Exposure mid time in hh:mm:ss.ss"
        type: string
      time_end:
        fits_keyword: EXPTMEND
        comment: "Exposure end time in hh:mm:ss.ss"
        type: string
      read_mode:
        fits_keyword: READMODE
        comment: "Readout mode"
        type: string
      num_groups:
        fits_keyword: NGROUPS
        comment: "Number of groups in integration"
        type: integer
      num_reads:
        fits_keyword: NREADS
        comment: "Number of reads per group"
        type: integer
      num_frames:
        fits_keyword: NFRAMES
        comment: "Total number of integrations"
        type: integer
      group_gap_time:
        fits_keyword: TGROUPGP
        comment: "Time between groups [s]"
        unit: sec
        type: number
      integration_time:
        fits_keyword: ITIME
        comment: "Effective light integration time [s]"
        unit: sec
        type: number
      exposure_time:
        fits_keyword: EXPTIME
        comment: "Effective exposure time [s]"
        unit: sec
        type: number
      num_resets_start:
        fits_keyword: NRSTSTRT
        comment: "Number of resets at start of exposure"
        type: integer
      data_problem:
        fits_keyword: DATAPROB
        comment: "Science telemetry indicated a problem"
        type: string
      exposure_num:
        fits_keyword: EXPNUM
        comment: "Exposure number in the sequence"
        type: integer
      sequence_tot:
        fits_keyword: EXPSQTOT
        comment: "Total number of exposures in the sequence"
        type: integer
