%YAML 1.2
---
type: object
properties:
  exposure:
    comment: "Exposure information"
    type: object
    properties:
      exposure_type:
        fits_keyword: IMTYPE
        comment: "Type of exposure"
        type: string
      data_quality:
        fits_keyword: DATAQUAL
        comment: "Data quality flag at the exposure level"
        type: string
        default: "GOOD"
      jd_start:
        fits_keyword: EXPJDST
        comment: "Exposure start time"
        unit: JD
        type: number
      jd_mid:
        fits_keyword: EXPJDMID
        comment: "Exposure mid time"
        unit: JD
        type: number
      jd_end:
        fits_keyword: EXPJDEND
        comment: "Exposure end time"
        unit: JD
        type: number
      read_mode:
        fits_keyword: READMODE
        comment: "Readout mode"
        type: string
      num_reads:
        fits_keyword: NREADS
        comment: "Total number of reads"
        type: integer
      exposure_time:
        fits_keyword: EXPTIME
        comment: "Effective exposure time [s]"
        unit: sec
        type: number
      num_resets_start:
        fits_keyword: NRSTSTRT
        comment: "Number of resets at start of exposure"
        type: integer
      exposure_id:
        fits_keyword: EXPID
        comment: "Exposure ID"
        type: integer
      exposure_num:
        fits_keyword: EXPNUM
        comment: "Exposure number in the sequence"
        type: integer
      sequence_tot:
        fits_keyword: EXPSQTOT
        comment: "Total number of exposures in the sequence"
        type: integer
