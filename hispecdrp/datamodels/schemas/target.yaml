%YAML 1.2
---
type: object
properties:
  target:
    comment: "Target information"
    type: object
    properties:
      airmass_start:
        comment: "Airmass at start of exposure"
        fits_keyword: AIRMAST
        type: string
      airmass_mid:
        comment: "Airmass at exposure midpoint"
        fits_keyword: AIRMAST
        type: string
      airmass_end:
        comment: "Airmass at end of exposure"
        fits_keyword: AIRMAST
        type: string
      azimuth_start:
        comment: "Azimuth at start of exposure in degrees"
        fits_keyword: AZST
        type: string
      azimuth_mid:
        comment: "Azimuth of target at exposure midpoint"
        fits_keyword: AZMID
        type: string
      azimuth_end:
        comment: "Azimuth at end of exposure"
        fits_keyword: AZEND
        type: string
      elevation_start:
        comment: "Elevation at start of exposure"
        fits_keyword: ELSTART
        type: string
      elevation_mid:
        comment: "Elevation of target at exposure midpoint"
        fits_keyword: ELMID
        type: string
      elevaiton_end:
        comment: "Elevation at end of exposure"
        fits_keyword: ELEND
        type: string
      equinox:
        comment: "Equinox of coordinates"
        fits_keyword: EQUINOX
        type: string
        default: "2000"
      ra:
        comment: "Target Right Ascension"
        fits_keyword: RA
        type: number
        unit: degrees
      dec:
        comment: "Target Declination"
        fits_keyword: DEC
        type: number
        unit: degrees
      ura:
        comment: "Target RA uncertainty"
        fits_keyword: URA
        type: number
        unit: degrees
      udec:
        comment: "Target Dec uncertainty"
        fits_keyword: UDEC
        type: number
        unit: degrees
      mu_ra:
        comment: "Target proper motion in RA"
        fits_keyword: MURA
        type: number
        unit: degrees
      mu_dec:
        comment: "Target proper motion in Dec"
        fits_keyword: MUDEC
        type: number
        unit: degrees
      mu_epoch:
        comment: "Target proper motion epoch"
        fits_keyword: MUEPOCH
        type: number
        unit: degrees
      target_name:
        comment: "Target name, configuration TBD"
        fits_keyword: TARGNAME
        type: string
      object_fiber1:
        comment: "Object name in fiber 1"
        fits_keyword: OBJFIB1
        type: string
      object_fiber2:
        comment: "Object name in fiber 2"
        fits_keyword: OBJFIB2
        type: string
      object_fiber3:
        comment: "Object name in fiber 3"
        fits_keyword: OBJFIB3
        type: string