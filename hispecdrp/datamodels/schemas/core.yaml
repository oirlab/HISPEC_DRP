%YAML 1.2
---
type: object
properties:
  date:
    comment: "ISO 8601 datetime YYYYMMDDTHHMMSS" # NOTE: TBD what this represents
    fits_keyword: DATE
    type: string
  date_created:
    comment: "ISO 8601 datetime file creation"
    fits_keyword: DATECRT
    type: string
  organization:
    comment: "Organization responsible for creating file"
    fits_keyword: ORG
    type: string
  filename:
    comment: "Name of the file"
    fits_keyword: FILENAME
    type: string
  file_type:
    comment: "Type of data in the file"
    fits_keyword: FILETYPE
    type: string
  telescope:
    comment: "Telescope used to acquire the data"
    fits_keyword: TELESCOP
    type: string
  data_level:
    comment: "Data level"
    fits_keyword: DATALVL
    type: string
  model_type:
    comment: "Type of data model"
    fits_keyword: DATAMODL
    type: string
  drp_version:
    comment: "DRP version used to create this file"
    fits_keyword: DRPVER
    type: string