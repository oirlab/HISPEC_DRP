# Guide (user-friendly):
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

# Specification (technical, formal):
# https://packaging.python.org/en/latest/specifications/pyproject-toml/


# Choosing a build backend:
# https://packaging.python.org/en/latest/tutorials/packaging-projects/#choosing-a-build-backend
[build-system]
requires = ["setuptools>=38.3.0", "wheel", "setuptools_scm>=8", "cython==3.2.4", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "hispecdrp/_version.py"
version_scheme = "post-release"

[project]
name = "hispecdrp"
dynamic = ["version"]
description = "Data Reduction Pipeline for the HISPEC instrument at the W. M. Keck Observatory."
readme = "README.md"
requires-python = ">=3.11.0"

# license = {file = "LICENSE.txt"}

authors = [
  {name = "Bryson Cale", email = "brcale@ucsd.edu" },
  {name = "Jean-Baptiste Ruffio", email = "jruffio@ucsd.edu" },
  {name = "Charlie Kilpatrick", email = "ckilpatrick@northwestern.edu" }
]

maintainers = [
  {name = "Bryson Cale", email = "brcale@ucsd.edu" },
  {name = "Jean-Baptiste Ruffio", email = "jruffio@ucsd.edu" },
  {name = "Charlie Kilpatrick", email = "ckilpatrick@northwestern.edu" }
]

classifiers = [
  "Development Status :: 1 - Planning",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  # numba>=0.66 is required for NumPy 2.4+; older numba raises ImportError at import.
  "numpy>=2.0",
  "scipy",
  "matplotlib",
  "astropy",
  "gitpython",
  "numba>=0.66.0",
  "tqdm",
  "stcal==1.15.2",
  "gdown",
  "koa_middleware @ git+https://github.com/oirlab/KOA_Middleware",
  "keckdrpframework @ git+https://github.com/oirlab/KeckDRPFramework@fix-python-version-parsing",
  "sqlite-utils>=3.39",
  "h5py",
  "jsonschema",
  "jsonref",
  # Required by barycenter_correction (imported via hispecdrp.primitives).
  "barycorrpy>=0.4.4",
  "plotly",
  "kaleido>=1",  # v1 API (write_fig_sync); PNG previews avoid plotly.io engine deprecation
]


[project.optional-dependencies]
dev = [
  "psutil",  # RSS sampling for pipeline performance benchmarks
]
test = ["pytest", "pytest-cov", "requests"]
docs = ["sphinx==9.1.0", "nbsphinx", "sphinx-astropy", "pandoc", "sphinx-multiversion", "sphinxawesome-theme==6.0.0"]
examples = ["emcee"]

[project.urls]
"Documentation" = "https://oirlab.github.io/HISPEC_DRP/"
"Source" = "https://github.com/oirlab/HISPEC_DRP"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["hispecdrp*", "benchmarks*"]
namespaces = false

[tool.setuptools.package-data]
hispecdrp = [
  "datamodels/metadata/*.yaml",
  "configs/*.yaml",
  "primitives/stellar_rv/previews/ccf_spectrum_overlay_unified.html.in",
  "data/wavesol/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: optional long-running integration tests (see test docstrings).",
]
# Default excludes @pytest.mark.slow (BT-Settl CCF, full rate-map paint, …).
# Full suite: pytest tests -m ""
# Slow only: pytest tests -m slow
filterwarnings = [
    "ignore:ERFA function.*dubious year:erfa.ErfaWarning",
]
addopts = [
    "--rootdir=.",
    "-m", "not slow",
    # Print every test duration (matches CI; useful when comparing local vs GHA logs).
    "--durations=0",
    "--ignore=tests/stage1/test_etalon_drift.py",
    "--ignore=tests/stage1/test_process_lfc_pipeline.py",
    "--ignore=tests/stage1/test_stage1_pipeline_hispec.py",
    "--ignore=tests/stage1/test_stage1_pipeline_parvi.py",
    "--ignore=tests/stage1/test_wavesol_geometry.py",
]
