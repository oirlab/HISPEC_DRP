# Guide (user-friendly):
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

# Specification (technical, formal):
# https://packaging.python.org/en/latest/specifications/pyproject-toml/


# Choosing a build backend:
# https://packaging.python.org/en/latest/tutorials/packaging-projects/#choosing-a-build-backend
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "hispecdrp"
version = "0.0.1"
description = "Data Reduction Pipeline for the HISPEC instrument at the W. M. Keck Observatory."
readme = "README.md"
requires-python = ">=3.11.0"

# license = {file = "LICENSE.txt"}

authors = [
  {name = "Bryson Cale", email = "brcale@ucsd.edu" },
  {name = "Jean-Baptiste Ruffio", email = "jruffio@ucsd.edu" }
]

maintainers = [
  {name = "Bryson Cale", email = "brcale@ucsd.edu" },
  {name = "Jean-Baptiste Ruffio", email = "jruffio@ucsd.edu" }
]

classifiers = [
  "Development Status :: 1 - Planning",
  "Topic :: Scientific/Engineering :: Astronomy",
  # "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "astropy",
  "pandas",
  "gitpython",
  "numba",
  #"keckdrpframework @ git+https://github.com/Keck-DataReductionPipelines/KeckDRPFramework#develop"
  "keckdrpframework @ git+https://github.com/oirlab/KeckDRPFramework@fix-python-version-parsing"
]


[project.optional-dependencies]
test = ["pytest", "pytest-cov", "requests", "tqdm"]
docs = ["sphinx", "nbsphinx", "sphinx-astropy", "pandoc", "sphinx-multiversion", "sphinxawesome-theme"]

[project.urls]
"Documentation" = "https://oirlab.github.io/HISPEC_DRP/"
"Source" = "https://github.com/oirlab/HISPEC_DRP"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["hispecdrp*"]
namespaces = false

[tool.setuptools.package-data]
hispecdrp = ["datamodels/schemas/*.yaml", "configs/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]