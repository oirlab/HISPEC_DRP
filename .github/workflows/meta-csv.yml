name: Metadata CSV

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  meta-csv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
        persist-credentials: true
        token: ${{ secrets.META_CSV_PUSH_TOKEN }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Update setuptools and wheel
      run: |
        python -m pip install --upgrade pip setuptools wheel Cython numpy
    - name: Building the cython extension
      run: |
        python setup.py build_ext --inplace
    - name: Install the package
      run: |
        pip install .
    - name: Generate meta.csv
      run: |
        python -c "from hispecdrp.datamodels.utils import meta_to_csv; meta_to_csv('hispecdrp/datamodels/meta.csv')"
    - name: Commit meta.csv if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add hispecdrp/datamodels/meta.csv
        if git diff --cached --quiet; then
          echo "meta.csv unchanged"
        else
          git commit -m "Update meta.csv [skip ci]"
          git push
        fi
